<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>Apply Mail</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.jpg">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      text-align: center;
      padding: 24px;
    }
    p {
      color: #94a3b8;
      margin-bottom: 20px;
      font-size: 15px;
    }
    a.btn {
      display: inline-block;
      background: #2563eb;
      color: #ffffff;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <p id="statusText">Membuka Gmail...</p>
  <a id="mailBtn" class="btn" href="#">Buka Gmail</a>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js");
    }

    function buildMailto() {
      const jam = new Date().getHours();
      let greeting = "Good Evening";

      if (jam >= 5 && jam < 12) {
        greeting = "Good Morning";
      } else if (jam >= 12 && jam < 18) {
        greeting = "Good Afternoon";
      }

      const subject = "Graphic Designer - Aryanata Wijaya";
      const body = `${greeting} HR team

My name is Aryanata Wijaya, and I would like to apply that position at your company

I have working experience as a Graphic Designer (2 years) at PT Sarwa Manggalla Raya

I sincerely hope for the opportunity to join your team

I have drop my CV and Portfolio links for your review and consideration

I am also willing to relocate to the area where the job is based

Thank you

https://arya.psce.pw/cvaryaen
https://arya.psce.pw/portfolioarya
https://linkedin.com/in/aryanatawijaya`;

      const url = `mailto:?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
      document.getElementById("mailBtn").href = url;
      document.getElementById("statusText").textContent = `Sapaan aktif: ${greeting} HR team`;
      return url;
    }

    let lastOpened = 0;
    function launchMail() {
      const now = Date.now();
      if (now - lastOpened < 3000) return;
      lastOpened = now;
      window.location.href = buildMailto();
    }

    launchMail();

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        launchMail();
      }
    });
  </script>
</body>
</html>
